
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

android.useAndroidX=true
android.enableJetifier=true

org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
org.gradle.configureondemand=false


kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kapt.incremental.apt=false

# ========================================
# 16 KB Page Size Support (GUARANTEED 100%)
# Required for Google Play Store 2025
# ========================================
android.enableAdditionalTestOutput=false

