

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.activity' && details.requested.name == 'activity') {
            details.useVersion '1.9.3'
        }
        if (details.requested.group == 'androidx.browser' && details.requested.name == 'browser') {
            details.useVersion '1.8.0'
        }
        if (details.requested.group == 'androidx.core' && details.requested.name == 'core-ktx') {
            details.useVersion '1.13.1'
        }
        if (details.requested.group == 'androidx.core' && details.requested.name == 'core') {
            details.useVersion '1.13.1'
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.0'
    implementation 'androidx.media3:media3-ui:1.5.0'
    implementation 'androidx.media3:media3-extractor:1.5.0' 
}

android {

    namespace = "com.sunrise.daliluna_altaalimi"
    compileSdk = 36
    ndkVersion = "26.3.11579264"

    compileOptions {
         coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }
    
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.sunrise.daliluna_altaalimi"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        // Support for 16KB page size (required for Google Play Store 2025)
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        
        // Alternative: If libraries don't support 16KB, inform Play Console
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }


    buildTypes {
        release {
            signingConfig = signingConfigs.release
            
            // Enable code shrinking and resource shrinking
            // This ensures compatibility with 16KB page sizes
            minifyEnabled true
            shrinkResources true
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            ndk {
                debugSymbolLevel 'FULL'
            }
        

        }
    }
     packaging {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
        }
    }
}

flutter {
    source = "../.."
}
