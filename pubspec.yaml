  collection: ^1.17.0
  cupertino_icons: ^1.0.8
  curved_labeled_navigation_bar: ^2.0.2
  curved_navigation_bar: ^1.0.6
  device_info_plus: ^12.3.0
  dio: ^5.9.0
  dropdown_button2: ^2.3.9
  file_picker: ^8.0.0
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_cache_manager: ^3.4.1
  syncfusion_flutter_pdfviewer: ^32.1.21
  flutter_custom_clippers: ^2.1.0
  flutter_date_pickers: ^0.4.3
  flutter_form_builder: ^10.2.0
  flutter_launcher_icons: ^0.14.3
  flutter_local_notifications: ^18.0.1
  flutter_native_splash: ^2.3.9
  flutter_rounded_date_picker: ^3.0.4
  flutter_staggered_animations: ^1.1.1
  get: ^4.6.5
  # gradients: ^0.1.1+2  # Temporarily disabled - incompatible with current Flutter SDK
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.5.0
  image_picker: ^1.1.2
  intl: ^0.20.0
  just_audio: ^0.9.36
  lottie: ^3.0.0
  open_filex: ^4.7.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  readmore: ^3.0.0
  record: ^5.0.0
  responsive_builder: ^0.7.1
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  socket_io_client: ^3.0.2
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  youtube_explode_dart: ^3.1.0
  webview_flutter: ^4.7.0
  # flutter_background_service: ^5.1.0
  timeago: ^3.6.1
  emulator_checker: ^1.0.4
  device_preview: ^1.3.1
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  archive: ^3.6.1
  url_launcher_android: ^6.3.13
  # Fix GetX backgroundColor issue with newer Flutter versions
  get: ^4.6.6
  # Fix platform package packageRoot issue
  platform: ^3.1.5
  # Fix record compatibility by using older platform interface
  record_platform_interface: 1.0.1

flutter_launcher_icons:
  android: true
  ios: true
  macos: true
  image_path: "assets/images/newlogo.jfif"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/newlogo.jfif"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/newlogo.jfif
    - assets/lottie/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
